{% extends "base.html" %}

{% block title %}Posziona - Login{% endblock %}

{% block content %}
<div class="login-screen">
    <h1>Posziona</h1>

    <!-- Startup screen: mode + server selection -->
    <div id="startup-screen" class="startup-screen">
        <div class="startup-card">
            <h2 id="startup-title">Posziona</h2>
            <p id="startup-subtitle">Select startup mode</p>
            <p id="server-identity" class="server-identity hidden"></p>

            <div id="recent-servers" class="recent-servers hidden">
                <p id="recent-title">Recent servers — tap to reconnect</p>
                <div id="recent-list" class="mode-options"></div>
            </div>

            <div class="mode-options" id="mode-options">
                <button id="mode-local" class="btn-primary mode-btn">
                    <span class="mode-label">This Server</span>
                    <span class="mode-desc">Log in on the server in the address bar</span>
                </button>
                <button id="mode-remote" class="btn-secondary mode-btn">
                    <span class="mode-label">Connect to Remote</span>
                    <span class="mode-desc">Enter a server IP address</span>
                </button>
            </div>

            <div id="remote-connect" class="remote-connect hidden">
                <input type="text" id="server-input" placeholder="192.168.1.10:5000" autocomplete="off">
                <button id="connect-btn" class="btn-primary">Connect</button>
                <button id="back-to-modes" class="btn-secondary">Back</button>
            </div>
        </div>
    </div>

    <!-- Login form (hidden until mode is chosen) -->
    <div id="login-form-container" class="login-form-container hidden">
        <div class="login-form">
            <select id="party-select" data-i18n-aria="party_label" aria-label="Party"></select>
            <input type="text" id="operator-name" placeholder="Operator Name" autocomplete="off">
            <input type="password" id="pin-input" placeholder="PIN" maxlength="4" autocomplete="off">
            <button id="login-btn" class="btn-primary">Login</button>
            <button id="admin-login-btn" class="btn-secondary">Admin Login</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts_extra %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    translateLoginPage();

    var startupScreen = document.getElementById('startup-screen');
    var modeOptions = document.getElementById('mode-options');
    var loginFormContainer = document.getElementById('login-form-container');
    var remoteConnect = document.getElementById('remote-connect');
    var modeLocalBtn = document.getElementById('mode-local');
    var modeRemoteBtn = document.getElementById('mode-remote');
    var serverInput = document.getElementById('server-input');
    var connectBtn = document.getElementById('connect-btn');
    var backToModesBtn = document.getElementById('back-to-modes');

    var pinInput = document.getElementById('pin-input');
    var loginBtn = document.getElementById('login-btn');
    var adminBtn = document.getElementById('admin-login-btn');
    var partySelect = document.getElementById('party-select');

    // Party dropdown: which party DB this login (and the whole shift)
    // works against. PINs are per-party, so the db travels with login.
    var partiesLoaded = false;
    function showLoginForm() {
        startupScreen.classList.add('hidden');
        remoteConnect.classList.add('hidden');
        loginFormContainer.classList.remove('hidden');
        if (!partiesLoaded) {
            partiesLoaded = true;
            loadPartyOptions(partySelect, getActiveDb()).catch(function() {
                // Server unreachable? Leave a single fallback option.
                partySelect.innerHTML = '';
                var opt = document.createElement('option');
                opt.value = 'default';
                opt.textContent = 'default';
                partySelect.appendChild(opt);
            });
        }
        pinInput.focus();
    }

    // --- Recent servers: one-tap reconnect (localStorage, max 5) ---
    // Typing the IP once is enough; afterwards the server is a button.
    // Storage may be blocked (private window) → stay silent, hide section.
    var RECENT_KEY = 'posServers';
    var recentWrap = document.getElementById('recent-servers');
    var recentList = document.getElementById('recent-list');
    var recentTitle = document.getElementById('recent-title');

    function loadRecent() {
        try {
            var v = JSON.parse(window.localStorage.getItem(RECENT_KEY) || '[]');
            return Array.isArray(v) ? v : [];
        } catch (e) {
            return [];
        }
    }

    function saveRecent(list) {
        try {
            window.localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5)));
        } catch (e) {}
    }

    function renderRecent() {
        if (!recentWrap || !recentList) return;
        var here = '';
        try { here = window.location.origin; } catch (e) {}
        recentList.innerHTML = '';
        var shown = 0;
        loadRecent().forEach(function(s) {
            if (!s || !s.url || s.url === here || s.url === 'null') return;
            var btn = document.createElement('button');
            btn.className = 'btn-secondary mode-btn';
            var label = document.createElement('span');
            label.className = 'mode-label';
            label.textContent = s.name || s.url;
            var desc = document.createElement('span');
            desc.className = 'mode-desc';
            desc.textContent = s.url;
            btn.appendChild(label);
            btn.appendChild(desc);
            btn.addEventListener('click', function() {
                window.location.href = s.url.replace(/\/+$/, '') + '/?mode=local';
            });
            recentList.appendChild(btn);
            shown++;
        });
        recentWrap.classList.toggle('hidden', shown === 0);
    }

    function rememberThisServer() {
        var origin = '';
        try { origin = window.location.origin; } catch (e) {}
        if (!origin || origin === 'null') { renderRecent(); return; }
        fetch('/api/status').then(function(r) { return r.json(); }).then(function(st) {
            var list = loadRecent().filter(function(s) { return s && s.url !== origin; });
            var name = (st && st.server_name) || origin;
            list.unshift({name: name, url: origin});
            saveRecent(list);
            renderRecent();
            // Identity line: with 2 machines running, staff must see WHICH
            // box this page comes from before logging in.
            var ident = document.getElementById('server-identity');
            if (ident) {
                var ver = (st && st.version) ? ' (v' + st.version + ')' : '';
                ident.textContent = t('this_server') + ': ' + name + ver;
                ident.classList.remove('hidden');
            }
        }).catch(function() { renderRecent(); });
    }

    // ?mode=local (set by the Connect button when hopping to another
    // server) → skip mode selection, show the login form straight away.
    // Without this, Connect reloaded the mode screen forever.
    var params;
    try {
        params = new URLSearchParams(window.location.search);
    } catch (e) {
        params = null;
    }
    if (params && params.get('mode') === 'local') {
        showLoginForm();
    }
    rememberThisServer();

    // Mode: Local Server — just show the login form
    modeLocalBtn.addEventListener('click', function() {
        showLoginForm();
    });

    // Mode: Remote — hide only the mode buttons (NOT the whole
    // startup screen: #remote-connect lives inside it, hiding the
    // parent kept the input invisible forever) and show the IP input.
    modeRemoteBtn.addEventListener('click', function() {
        modeOptions.classList.add('hidden');
        remoteConnect.classList.remove('hidden');
        serverInput.focus();
    });

    // Back from remote screen to mode selection
    backToModesBtn.addEventListener('click', function() {
        remoteConnect.classList.add('hidden');
        modeOptions.classList.remove('hidden');
    });

    // Connect to remote server
    connectBtn.addEventListener('click', function() {
        var input = serverInput.value.trim();
        if (!input) {
            alert('Please enter a server IP address');
            serverInput.focus();
            return;
        }
        // Normalize: prepend http:// if missing
        if (!input.startsWith('http://') && !input.startsWith('https://')) {
            input = 'http://' + input;
        }
        input = input.replace(/\/+$/, '') + '/';
        var target;
        try {
            target = new URL(input);
        } catch (e) {
            alert('Invalid address: ' + input);
            serverInput.focus();
            return;
        }
        if (target.origin === window.location.origin) {
            // Already on that server (e.g. retyped its own IP) — just
            // show the login instead of reloading the mode screen.
            showLoginForm();
            return;
        }
        // Navigate to the remote server and skip ITS mode screen:
        // ?mode=local opens the login form directly there.
        window.location.href = target.origin + '/?mode=local';
    });

    // Allow Enter key on server input
    serverInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') connectBtn.click();
    });

    function attemptLogin(isAdmin) {
        var pin = pinInput.value.trim();
        if (!pin || pin.length < 4) {
            alert('Please enter a 4-digit PIN');
            pinInput.focus();
            return;
        }
        var party = (partySelect && partySelect.value) || getActiveDb();

        fetch('/api/auth/login' + (isAdmin ? '/admin' : '') + '?db=' + encodeURIComponent(party), {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({pin: pin})
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
                pinInput.value = '';
                pinInput.focus();
            } else if (data.must_change_pin) {
                setActiveDb(party);
                // Factory PIN: send straight to the admin panel (where PINs
                // are changed) with a flag that raises an unmissable banner.
                try { sessionStorage.setItem('mustChangePin', '1'); } catch (e) {}
                window.location.href = '/admin';
            } else {
                setActiveDb(party);
                window.location.href = '/pos';
            }
        });
    }

    loginBtn.addEventListener('click', () => attemptLogin(false));
    adminBtn.addEventListener('click', () => attemptLogin(true));
    pinInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') attemptLogin(false);
    });
});
</script>
{% endblock %}
