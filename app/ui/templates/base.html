<!DOCTYPE html>
<html lang="{{ request.cookies.get('lang', 'en') if request else 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f5f1">
    <meta name="description" content="Posziona — a small point of sale for parties and events.">
    <title>{% block title %}Posziona{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23136f55'/%3E%3Ctext x='32' y='44' font-family='system-ui,sans-serif' font-size='36' font-weight='700' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <div id="app-container">
        {% block content %}{% endblock %}
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/translations.js"></script>
    {% block scripts_extra %}{% endblock %}
</body>
</html>
